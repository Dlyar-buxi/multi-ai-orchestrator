# 全局配置 —— 多模型网页版自动协同框架
browser:
  # Firefox 特制内核由 Playwright 启动，两个独立实例（任务栏各一个窗口）
  # private = 隐私版实例（隔离环境）→ ChatGPT / Claude
  # normal  = 正常版实例            → 其余站点
  engine: firefox
  headless: false
  groups:
    private:
      profile: ./ff_profile_private
      proxy: socks5://127.0.0.1:1080   # 隐私版实例走本地代理（ChatGPT/Claude 需要代理访问）
      # UA 伪装成 FirefoxFQ 内核(Firefox ESR 140)，使导入的 cf_clearance 通行证 UA 校验一致
      user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:140.0) Gecko/20100101 Firefox/140.0"
    normal:
      profile: ./ff_profile_normal
      proxy: null                       # 正常版直连（国内站点）
  nav_timeout: 45          # 页面加载超时（秒）
  reply_timeout: 300       # 等待模型回复总超时（秒）
  stability_ms: 2500       # 回复文本连续无变化视为生成完毕
  poll_interval_ms: 800
  session_reuse: true      # 会话复用：回到上次会话继续聊，站点原生记住全部上下文
  session_reuse_limit: 10000  # 同一会话连用上限（用户要求1万起步）；真卡死时下一轮goto失败会自动降级开新会话

ollama:
  enabled: true
  base_url: http://localhost:11434
  model: qwen2.5:7b

coordinator:
  # 协调员（任务分解/汇总仲裁）：auto=有云端key用云端,否则本地ollama | ollama | cloud
  provider: auto
  api_key_file: zhipu_key.txt    # 智谱key存这里（已gitignore），或环境变量 ZHIPU_API_KEY
  base_url: https://open.bigmodel.cn/api/paas/v4
  model: glm-4-flash             # 免费档

git:
  enabled: true
  repo_dir: .
  remote: origin
  branch: main
  auto_push: true
  # 隐私白名单：只上传这些路径（.gitignore 里还有一层红线兜底）
  paths:
    - outputs/               # 模型产出。不想公开就删掉这行

github:
  # 新建仓库能力用。PAT 存本地文件（已 gitignore）或设环境变量 GITHUB_TOKEN
  token_file: github_token.txt

log_file: ./logs/session.jsonl
