name: kimi
group: normal
url: https://www.kimi.com/
url_match: ["kimi.com", "kimi.moonshot.cn"]
mode_text: "K3"                      # 模型选择器式，找不到自动跳过
input_selectors:
  - "div.chat-input-editor"           # 实测: contenteditable div
  - ".chat-input-editor"
  - "textarea"
send_selectors:
  - "button.send-button"
send_key: Enter
assistant_selectors:
  - "[class*='segment-content'] .paragraph"   # 实测: 回复段落容器
  - ".paragraph"
  - "[class*='markdown']"
streaming_hints:
  - ".stop-button"
