name: kimi
group: normal
url: https://www.kimi.com/
url_match: ["kimi.com", "kimi.moonshot.cn"]
input_selectors:
  - "textarea.chat-input-input"
  - "textarea"
  - ".ProseMirror[contenteditable='true']"
send_selectors:
  - "button.send-button"
  - ".send-button"
send_key: Enter
assistant_selectors:
  - ".markdown-body"
  - ".message-content"
streaming_hints:
  - ".stop-button"
