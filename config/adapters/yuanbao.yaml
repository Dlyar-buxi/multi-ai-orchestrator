name: yuanbao
group: normal
url: https://yuanbao.tencent.com/chat
url_match: ["yuanbao.tencent.com"]
input_selectors:
  - "div.ql-editor"                    # 实测: Quill 编辑器（可见）
  - ".ql-editor[contenteditable='true']"
send_selectors:
  - "button[class*='send']"
send_key: Enter
assistant_selectors:
  - "[class*='agent-chat__bubble__content']"
  - "[class*='hyc-content']"
streaming_hints: []
