name: doubao
group: normal
url: https://www.doubao.com/chat/
url_match: ["doubao.com/chat"]
input_selectors:
  - "textarea[data-testid='chat_input_input']"
  - "textarea"
send_selectors:
  - "button[data-testid='chat_input_send_button']"
send_key: Enter
assistant_selectors:
  - "[data-testid='receive_message']"
  - ".message-content-container"
streaming_hints:
  - ".stop-button"
