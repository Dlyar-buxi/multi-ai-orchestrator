name: doubao
group: normal
url: https://www.doubao.com/chat/
url_match: ["doubao.com/chat"]
mode_trigger: "对话模式"             # 触发器显示当前模式名
mode_text: "工作模式"                # 下拉菜单中目标选项；可见=已激活
input_selectors:
  - "div.tiptap.ProseMirror"          # 实测: tiptap 富文本编辑器
  - ".ProseMirror[contenteditable='true']"
send_selectors:
  - "button[data-testid='chat_input_send_button']"
send_key: Enter
assistant_selectors:
  - "div[class*='message-list'] div[class*='content-']"   # 实测: hash class 但前缀稳定
  - "[class*='receive_message']"
streaming_hints:
  - ".stop-button"
