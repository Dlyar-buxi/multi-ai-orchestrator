# Codex 网页版复用 ChatGPT 界面结构
name: codex
group: private   # 与 chatgpt 同域，跟随隐私版；如需正常版改为 normal
url: https://chatgpt.com/codex
url_match: ["chatgpt.com/codex"]
input_selectors:
  - "#prompt-textarea"
  - "textarea"
send_selectors:
  - "button[data-testid='send-button']"
send_key: Enter
assistant_selectors:
  - "[data-message-author-role='assistant'] .markdown"
  - "[data-message-author-role='assistant']"
streaming_hints: []
